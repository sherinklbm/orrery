name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: for d in console bridge llm-gate; do (cd $d && python -m unittest discover -s tests) || exit 1; done
      - name: SSH safety scripts
        run: bash deploy/scripts/test-ssh-safety.sh
      - name: Shell syntax
        run: for f in get.sh deploy/*.sh deploy/scripts/orrery-*; do bash -n "$f" || exit 1; done
